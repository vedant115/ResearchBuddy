services:
  # Backend API service
  - type: web
    name: research-buddy-api
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_API_KEY
        sync: false
    healthCheckPath: /api/health

  # Frontend static site
  - type: web
    name: research-buddy-frontend
    env: static
    buildCommand: >
      cd frontend && 
      npm install && 
      mkdir -p public && 
      cp node_modules/pdfjs-dist/build/pdf.worker.min.js public/ && 
      npm run build && 
      cp node_modules/pdfjs-dist/build/pdf.worker.min.js dist/
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 18
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=86400
      - path: /pdf.worker.min.js
        name: Content-Type
        value: application/javascript
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://research-buddy-api.onrender.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self';"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
